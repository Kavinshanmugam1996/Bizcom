<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bizcom AI Risk Assessment</title>

    <!-- React & ReactDOM (pinned versions) -->
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>

    <!-- Recharts dependencies -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

    <!-- Babel for JSX (must load last, before the babel script) -->
    <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background: #F4F6F9;
        }

        #root {
            min-height: 100vh;
        }
    </style>
</head>

<body>
    <div id="root">
        <div
            style="display:flex; justify-content:center; align-items:center; height:100vh; font-family:sans-serif; color:#0B1D33;">
            <h3>Loading Bizcom AI Risk Assessment...</h3>
        </div>
    </div>

    <script>
        window.onerror = function (msg, url, lineNo, columnNo, error) {
            var message = [
                'Message: ' + msg,
                'URL: ' + url,
                'Line: ' + lineNo,
                'Column: ' + columnNo,
                'Error object: ' + JSON.stringify(error)
            ].join(' - ');
            console.error(message);
            // Only alert if it's likely a critical initialization error
            if (msg.indexOf('Babel') !== -1 || msg.indexOf('React') !== -1) {
                alert("An error occurred during application startup: " + msg);
            }
            return false;
        };
    </script>

    <!-- Main Script (inlined by server) -->
    <script type="text/babel" src="/Script.js"></script>
</body>

</html>
